[build-system]
requires = ["hatchling~=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jsonrpyc"
description = "Minimal python RPC based on the JSON-RPC 2.0 specs from http://www.jsonrpc.org/specification."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Marcel Rieger", email = "github.riga@icloud.com"},
]
keywords = [
  "rpc",
  "json",
  "json-rpc",
  "jsonrpc"
]
classifiers = [
  "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
]
dynamic = ["version"]
# pinned to 3.9
dependencies = [
  "typing_extensions~=4.8",
]

[project.optional-dependencies]
# pinned to 3.9
dev = [
  "build~=1.4;python_version < '3.10'",
  "build~=1.5;python_version >= '3.10'",
  "twine~=6.2",
  "mypy~=1.19;python_version < '3.10'",
  "mypy~=2.1;python_version >= '3.10'",
  "pytest~=8.4;python_version < '3.10'",
  "pytest~=9.1;python_version >= '3.10'",
  "pytest-cov~=7.1",
  "types-docutils~=0.22",
  "pre-commit~=4.3;python_version < '3.10'",
  "pre-commit~=4.6;python_version >= '3.10'"
]
# pinned to 3.13, see .readthedocs.yaml
docs = [
  "sphinx~=9.1",
  "sphinx-autodoc-typehints~=3.11",
  "sphinx-book-theme~=1.2",
  "sphinx-lfs-content~=1.1",
  "autodocsumm~=0.2",
  "myst-parser~=5.1",
]

[project.urls]
Homepage = "https://github.com/riga/jsonrpyc"
Documentation = "https://jsonrpyc.readthedocs.io"
Repository = "https://github.com/riga/jsonrpyc.git"
Issues = "https://github.com/riga/jsonrpyc/issues"

[tool.hatch]
version.path = "src/jsonrpyc/__meta__.py"
metadata.allow-direct-references = true

[tool.hatch.build]
exclude = [
  "/.github",
  "/docs",
  "/tests",
  "/tmp",
  "/dist",
  "/build",
  "/.venv",
  "*.py[cod]",
  "__pycache__",
  ".git*",
  ".readthedocs.yaml",
  "codecov.yml",
  ".pre-commit-config.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jsonrpyc"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
exclude = ["docs", "build"]

[tool.ruff.lint]
preview = true
ignore = [
  "PLR",
  "return-in-generator",
  "zip-without-explicit-strict",
  "module-import-not-at-top-of-file",
  "logging-f-string",
  "missing-required-import",
  "single-line-implicit-string-concatenation",
  "redefined-loop-name",
  "lambda-assignment",
  "raw-string-in-exception",
  "f-string-in-exception",
  "needless-bool",
  "unused-noqa",
  "noqa-comments",
  "import-outside-top-level",
  "global-statement",
  "bad-dunder-method-name",
  "too-many-statements-in-try-clause",
  "mutable-class-default",
  "quadratic-list-summation",
  "used-dummy-variable",
  "non-empty-init-module",
  "unnecessary-assign",
  "non-pep695-type-alias",
  "open-file-with-context-handler",
]
select = [
  "E",
  "F",
  "W",  # flake8
  "B",  # flake8-bugbear
  "I",  # isort
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "G",  # flake8-logging-format
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "RET",  # flake8-return
  "RUF",  # ruff-specific
  "SIM",  # flake8-simplify
  "UP",  # pyupgrade
  "YTT",  # flake8-2020
  "EXE",  # flake8-executable
  "missing-trailing-comma",
  "too-many-blank-lines",
]
unfixable = [
  "unused-variable",
]
flake8-unused-arguments.ignore-variadic-names = true
isort.required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.13"
strict = false
files = ["src/jsonrpyc", "tests"]
exclude = ["docs", "build"]
disable_error_code = ["no-redef", "no-untyped-def", "valid-type", "method-assign"]
warn_unreachable = false
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "--cov=jsonrpyc --cov-report xml:coverage.xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/jsonrpyc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 5
